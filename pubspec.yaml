name: studenthold_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  http: ^1.2.2
  html: ^0.15.4
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.2
  dio: ^5.11.1

dependency_overrides:
  path_provider_foundation: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F7F4"
  adaptive_icon_foreground: "assets/icon/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
